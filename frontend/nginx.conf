server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Encabezados de seguridad equivalentes a staticwebapp.config.json
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Solo para pruebas locales con docker-compose.pruebas.yml: el canje del código de login (PKCE)
  # va al proveedor OIDC de prueba por este mismo origen. Si el contenedor "oidc" no existe,
  # nginx igual arranca (la resolución es diferida) y esta ruta responde 502.
  resolver 127.0.0.11 valid=10s ipv6=off;
  location /oidc/ {
    set $oidc http://oidc:8080;
    rewrite ^/oidc/(.*)$ /$1 break;
    proxy_pass $oidc;
    proxy_set_header Host localhost:8090;
  }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 20m;
  }

  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
